<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img">
<title>发送：回调链 sender_；收尾：关连接 → 判断停止 → 回外层重连</title>
<desc>上半部分：驱动在拉流线程里造好 protobuf 对象，通过基类成员 sender_ 这个 std::function 回调，把输出 topic 和数据一起交给框架组件，框架再按 topic 发到对应的 CyberRT channel。传的是 shared_ptr，不拷贝大块 H.264 数据。下半部分：内层读帧循环退出后，先关掉这条 RTSP 连接并释放 FFmpeg 上下文（不关线程），只有在不是主动停止的情况下才睡重连间隔 5 秒，然后回到外层重新连接。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g font-family="system-ui, -apple-system, sans-serif">

<rect x="60" y="40" width="580" height="210" rx="16" fill="#26215C" stroke="#534AB7" stroke-width="0.5"/>
<text x="76" y="64" font-size="13" font-weight="500" fill="#CECBF6" dominant-baseline="central">① 发送：把贴好地址的包裹交给快递公司（回调就发生在拉流线程里）</text>

<rect x="76" y="90" width="110" height="56" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="131" y="110" font-size="13" font-weight="500" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">驱动内造对象</text>
<text x="131" y="128" font-size="11" fill="#B4B2A9" text-anchor="middle" dominant-baseline="central">CompressedImage</text>

<path d="M188 118 H212" fill="none" stroke="#AFA9EC" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="214" y="90" width="120" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="274" y="110" font-size="11" font-weight="500" fill="#B5D4F4" text-anchor="middle" dominant-baseline="central">sender_(topic,data)</text>
<text x="274" y="128" font-size="11" fill="#85B7EB" text-anchor="middle" dominant-baseline="central">基类 std::function</text>

<path d="M336 118 H360" fill="none" stroke="#AFA9EC" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="362" y="90" width="120" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="422" y="110" font-size="11" font-weight="500" fill="#B5D4F4" text-anchor="middle" dominant-baseline="central">MultiStreamCallBack</text>
<text x="422" y="128" font-size="11" fill="#85B7EB" text-anchor="middle" dominant-baseline="central">框架组件接住</text>

<path d="M484 118 H508" fill="none" stroke="#AFA9EC" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="510" y="90" width="118" height="56" rx="8" fill="#173404" stroke="#97C459" stroke-width="0.5"/>
<text x="569" y="110" font-size="11" font-weight="500" fill="#C0DD97" text-anchor="middle" dominant-baseline="central">Send(topic,data)</text>
<text x="569" y="128" font-size="11" fill="#97C459" text-anchor="middle" dominant-baseline="central">CyberRT Writer</text>

<text x="76" y="172" font-size="12" fill="#CECBF6" dominant-baseline="central">topic = 收件地址，data = 包裹；驱动自己没有 Writer，只能拜托框架按 topic 发到对应 channel</text>
<text x="76" y="200" font-size="12" fill="#AFA9EC" dominant-baseline="central">传的是 shared_ptr：只把引用计数 +1，不拷贝那几 KB~几 MB 的 H.264 数据，交出去后对方只读</text>
<text x="76" y="226" font-size="12" fill="#888780" dominant-baseline="central">if (sender_) 是在判断「这个回调有没有被绑定」，空的话调用会抛 bad_function_call</text>

<rect x="60" y="270" width="580" height="200" rx="16" fill="#04342C" stroke="#0F6E56" stroke-width="0.5"/>
<text x="76" y="294" font-size="13" font-weight="500" fill="#9FE1CB" dominant-baseline="central">② 收尾：内层读帧循环退出之后（.cc:346-356）</text>

<rect x="76" y="320" width="176" height="56" rx="8" fill="#173404" stroke="#97C459" stroke-width="0.5"/>
<text x="164" y="340" font-size="12" font-weight="500" fill="#C0DD97" text-anchor="middle" dominant-baseline="central">avformat_close_input</text>
<text x="164" y="358" font-size="11" fill="#97C459" text-anchor="middle" dominant-baseline="central">关这条连接 + 释放上下文</text>

<path d="M254 348 H282" fill="none" stroke="#5DCAA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="284" y="320" width="176" height="56" rx="8" fill="#173404" stroke="#97C459" stroke-width="0.5"/>
<text x="372" y="340" font-size="12" font-weight="500" fill="#C0DD97" text-anchor="middle" dominant-baseline="central">if(!stop &amp;&amp; !stop_)</text>
<text x="372" y="358" font-size="11" fill="#97C459" text-anchor="middle" dominant-baseline="central">才 sleep 重连间隔 5 秒</text>

<path d="M462 348 H490" fill="none" stroke="#5DCAA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="492" y="320" width="136" height="56" rx="8" fill="#173404" stroke="#97C459" stroke-width="0.5"/>
<text x="560" y="340" font-size="12" font-weight="500" fill="#C0DD97" text-anchor="middle" dominant-baseline="central">回到外层 while</text>
<text x="560" y="358" font-size="11" fill="#97C459" text-anchor="middle" dominant-baseline="central">重新 ConnectRtspStream</text>

<text x="76" y="400" font-size="12" fill="#9FE1CB" dominant-baseline="central">关掉的是【这条 RTSP 连接】，不是线程——线程还活着，只是出了内层读帧循环</text>
<text x="76" y="428" font-size="12" fill="#FAC775" dominant-baseline="central">主动停止时 stop_/stop 已是 true → 不睡这 5 秒 → 回外层条件不成立 → 线程干净退出（优雅退出）</text>
<text x="76" y="454" font-size="12" fill="#5DCAA5" dominant-baseline="central">对比：从未连上走 .cc:238-243 的失败分支，同样是睡 5 秒再试，两条路殊途同归</text>

</g>
</svg>
