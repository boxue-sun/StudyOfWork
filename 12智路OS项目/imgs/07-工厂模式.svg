<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img">
<title>检测器框架：基类+工厂+6类子类</title>
<desc>TrafficFlowFactory 的 build_detectors_from_config 按配置 type 字段用 make_unique 创建 6 类 AccumulateXxxDetector，它们都继承抽象基类 AccumulateDetector 并 override update 与 calculate_once 两个纯虚接口。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g font-family="system-ui, -apple-system, sans-serif">
<g>
<rect x="240" y="30" width="200" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="340" y="52" text-anchor="middle" dominant-baseline="central" fill="#B5D4F4" font-size="14" font-weight="500">TrafficFlowFactory</text>
<text x="340" y="72" text-anchor="middle" dominant-baseline="central" fill="#85B7EB" font-size="12">build_detectors_from_config</text>
</g>
<rect x="240" y="120" width="200" height="56" rx="8" fill="#26215C" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="142" text-anchor="middle" dominant-baseline="central" fill="#CECBF6" font-size="14" font-weight="500">AccumulateDetector</text>
<text x="340" y="162" text-anchor="middle" dominant-baseline="central" fill="#CECBF6" font-size="12">update() / calculate_once() 纯虚</text>
<g>
<rect x="20" y="250" width="100" height="70" rx="8" fill="#173404" stroke="#97C459" stroke-width="0.5"/>
<text x="70" y="272" text-anchor="middle" dominant-baseline="central" fill="#C0DD97" font-size="13" font-weight="500">volume</text>
<text x="70" y="292" text-anchor="middle" dominant-baseline="central" fill="#97C459" font-size="12">流量</text>
<text x="70" y="308" text-anchor="middle" dominant-baseline="central" fill="#97C459" font-size="11">AccumVolume</text>
</g>
<g>
<rect x="130" y="250" width="100" height="70" rx="8" fill="#173404" stroke="#97C459" stroke-width="0.5"/>
<text x="180" y="272" text-anchor="middle" dominant-baseline="central" fill="#C0DD97" font-size="13" font-weight="500">queue</text>
<text x="180" y="292" text-anchor="middle" dominant-baseline="central" fill="#97C459" font-size="12">排队</text>
<text x="180" y="308" text-anchor="middle" dominant-baseline="central" fill="#97C459" font-size="11">AccumQueue</text>
</g>
<g>
<rect x="240" y="250" width="100" height="70" rx="8" fill="#173404" stroke="#97C459" stroke-width="0.5"/>
<text x="290" y="272" text-anchor="middle" dominant-baseline="central" fill="#C0DD97" font-size="13" font-weight="500">speed</text>
<text x="290" y="292" text-anchor="middle" dominant-baseline="central" fill="#97C459" font-size="12">车速</text>
<text x="290" y="308" text-anchor="middle" dominant-baseline="central" fill="#97C459" font-size="11">AccumSpeed</text>
</g>
<g>
<rect x="350" y="250" width="100" height="70" rx="8" fill="#173404" stroke="#97C459" stroke-width="0.5"/>
<text x="400" y="272" text-anchor="middle" dominant-baseline="central" fill="#C0DD97" font-size="13" font-weight="500">headway</text>
<text x="400" y="292" text-anchor="middle" dominant-baseline="central" fill="#97C459" font-size="12">车头时距</text>
<text x="400" y="308" text-anchor="middle" dominant-baseline="central" fill="#97C459" font-size="11">AccumHeadway</text>
</g>
<g>
<rect x="460" y="250" width="100" height="70" rx="8" fill="#173404" stroke="#97C459" stroke-width="0.5"/>
<text x="510" y="272" text-anchor="middle" dominant-baseline="central" fill="#C0DD97" font-size="13" font-weight="500">crosswalk</text>
<text x="510" y="292" text-anchor="middle" dominant-baseline="central" fill="#97C459" font-size="12">过街</text>
<text x="510" y="308" text-anchor="middle" dominant-baseline="central" fill="#97C459" font-size="11">AccumCross</text>
</g>
<g>
<rect x="570" y="250" width="100" height="70" rx="8" fill="#173404" stroke="#97C459" stroke-width="0.5"/>
<text x="620" y="272" text-anchor="middle" dominant-baseline="central" fill="#C0DD97" font-size="13" font-weight="500">overflow</text>
<text x="620" y="292" text-anchor="middle" dominant-baseline="central" fill="#97C459" font-size="12">溢流</text>
<text x="620" y="308" text-anchor="middle" dominant-baseline="central" fill="#97C459" font-size="11">AccumOver</text>
</g>
<path d="M340 86 L340 120" fill="none" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 176 L70 250" fill="none" stroke="#97C459" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 176 L180 250" fill="none" stroke="#97C459" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 176 L290 250" fill="none" stroke="#97C459" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 176 L400 250" fill="none" stroke="#97C459" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 176 L510 250" fill="none" stroke="#97C459" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 176 L620 250" fill="none" stroke="#97C459" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="103" text-anchor="middle" fill="#CECBF6" font-size="12">按 type 配置 make_unique 创建</text>
<text x="340" y="234" text-anchor="middle" fill="#9FE1CB" font-size="12">6 类均继承基类 · override 两接口</text>
</g>
</svg>
