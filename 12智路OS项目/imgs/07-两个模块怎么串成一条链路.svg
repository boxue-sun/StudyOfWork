<svg xmlns="http://www.w3.org/2000/svg" width="680" height="620" viewBox="0 0 680 620" role="img">
<title>两个模块怎么串成一条业务链路</title>
<desc>上半部分：完整业务链路——相机出 RTSP 流，我做的拉流驱动接进来发到 CyberRT 的 h264 channel；中间的解码、目标检测跟踪、多传感器融合是算法团队做的，产出结构化的 RSM 感知结果；我做的交通参数检测服务订阅 RSM 消息，按车道和停止线算流量指标再上报。下半部分对比两套技术栈：AirOS 侧用 CyberRT 加 protobuf，流量检测侧用 Fast-DDS 加 JSON，业务上通过标准 RSM 消息衔接。底部给出面试口播要点。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g font-family="system-ui, -apple-system, sans-serif">

<rect x="60" y="40" width="580" height="255" rx="16" fill="#26215C" stroke="#534AB7" stroke-width="0.5"/>
<text x="76" y="64" font-size="13" font-weight="500" fill="#CECBF6" dominant-baseline="central">一条业务链路上的四棒接力（绿色 = 我做的，灰色 = 别人做的）</text>

<rect x="76" y="100" width="80" height="60" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="116" y="120" font-size="13" font-weight="500" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">相机</text>
<text x="116" y="140" font-size="11" fill="#B4B2A9" text-anchor="middle" dominant-baseline="central">RTSP 出流</text>
<path d="M156 130 H172" fill="none" stroke="#AFA9EC" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="172" y="100" width="122" height="60" rx="8" fill="#173404" stroke="#97C459" stroke-width="0.5"/>
<text x="233" y="120" font-size="13" font-weight="500" fill="#C0DD97" text-anchor="middle" dominant-baseline="central">拉流驱动</text>
<text x="233" y="140" font-size="11" fill="#97C459" text-anchor="middle" dominant-baseline="central">①我做的·每路一线程</text>
<path d="M294 130 H310" fill="none" stroke="#AFA9EC" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="310" y="100" width="145" height="60" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="382" y="120" font-size="12" font-weight="500" fill="#B5D4F4" text-anchor="middle" dominant-baseline="central">CyberRT channel</text>
<text x="382" y="140" font-size="11" fill="#85B7EB" text-anchor="middle" dominant-baseline="central">h264/&lt;IP&gt;</text>
<path d="M455 130 H471" fill="none" stroke="#AFA9EC" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="471" y="100" width="130" height="60" rx="8" fill="#2C2C2A" stroke="#5F5E5B" stroke-width="0.5"/>
<text x="536" y="120" font-size="13" font-weight="500" fill="#888780" text-anchor="middle" dominant-baseline="central">感知融合</text>
<text x="536" y="140" font-size="11" fill="#5F5E5B" text-anchor="middle" dominant-baseline="central">②别人做的</text>

<path d="M536 160 V205 H151 V215" fill="none" stroke="#FAC775" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="343" y="190" font-size="11" fill="#FAC775" text-anchor="middle" dominant-baseline="central">解码 + 检测/跟踪 + 融合 → 结构化目标（车/人/非机动车 + 经纬度·速度·航向）</text>

<rect x="76" y="215" width="150" height="60" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="151" y="235" font-size="12" font-weight="500" fill="#B5D4F4" text-anchor="middle" dominant-baseline="central">RSMJsonTopic</text>
<text x="151" y="255" font-size="11" fill="#85B7EB" text-anchor="middle" dominant-baseline="central">③感知结果消息</text>
<path d="M226 245 H242" fill="none" stroke="#AFA9EC" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="244" y="215" width="140" height="60" rx="8" fill="#173404" stroke="#97C459" stroke-width="0.5"/>
<text x="314" y="235" font-size="13" font-weight="500" fill="#C0DD97" text-anchor="middle" dominant-baseline="central">交通参数检测</text>
<text x="314" y="255" font-size="11" fill="#97C459" text-anchor="middle" dominant-baseline="central">④我做的·6 类检测器</text>
<path d="M384 245 H400" fill="none" stroke="#AFA9EC" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="402" y="215" width="130" height="60" rx="8" fill="#173404" stroke="#97C459" stroke-width="0.5"/>
<text x="467" y="235" font-size="13" font-weight="500" fill="#C0DD97" text-anchor="middle" dominant-baseline="central">流量指标</text>
<text x="467" y="255" font-size="11" fill="#97C459" text-anchor="middle" dominant-baseline="central">发布上报</text>

<text x="76" y="330" font-size="12" fill="#AFA9EC" dominant-baseline="central">我参与的是首尾两端（①④），中间的②③不是我做的——这条路要走通，但不能说成「我的数据直接喂给了它」</text>

<rect x="60" y="355" width="580" height="140" rx="16" fill="#04342C" stroke="#0F6E56" stroke-width="0.5"/>
<text x="76" y="379" font-size="13" font-weight="500" fill="#9FE1CB" dominant-baseline="central">两套技术栈（所以它们不是「同一个程序里的两个函数」）</text>

<rect x="76" y="395" width="260" height="72" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="206" y="415" font-size="13" font-weight="500" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">AirOS 设备接入侧</text>
<text x="206" y="435" font-size="11" fill="#B4B2A9" text-anchor="middle" dominant-baseline="central">CyberRT + Protobuf</text>
<text x="206" y="453" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">/sensor/ipcamera/h264/&lt;IP&gt;</text>

<rect x="356" y="395" width="272" height="72" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="492" y="415" font-size="13" font-weight="500" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">流量检测侧（算法插件）</text>
<text x="492" y="435" font-size="11" fill="#B4B2A9" text-anchor="middle" dominant-baseline="central">Fast-DDS + JSON（宿主 FusionService 的 C 插件接口）</text>
<text x="492" y="453" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">RSMJsonTopic:9 / domain_id 11</text>

<text x="76" y="482" font-size="12" fill="#9FE1CB" dominant-baseline="central">业务上靠标准 RSM 消息衔接，通信框架各走各的——这是公司不同团队的选型，不是我拼的</text>

<rect x="60" y="515" width="580" height="90" rx="16" fill="#26215C" stroke="#534AB7" stroke-width="0.5"/>
<text x="76" y="539" font-size="13" font-weight="500" fill="#CECBF6" dominant-baseline="central">面试怎么说才不翻车</text>
<text x="76" y="562" font-size="12" fill="#D3D1C7" dominant-baseline="central">✅ 能说：同属公司路侧感知产品线、部署在同一台 AGX Orin、走同一条业务链路，我做了首尾两端</text>
<text x="76" y="583" font-size="12" fill="#FAC775" dominant-baseline="central">❌ 不能说：「我拉的视频流直接给了流量模块」——中间隔着解码和感知融合</text>

</g>
</svg>
