<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>多路视频流接入模块的整体框架：静态结构、启动、主干循环、内层一圈、发布、收尾</title>
<desc>六层框架。第一层静态结构（组件、驱动插件、档案袋、快递柜）；第二层怎么被拉起（三层配置、工厂 new 驱动、起 N 个线程）；第三层主干循环（每路一线程，外层管重连、内层管读帧）；第四层内层一圈（读包、滤流、封装、统计、发送、释放）是核心；第五层东西怎么出去（四跳发到 CyberRT channel）；第六层怎么退（断线重连与优雅退出）。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="28" font-size="14" font-weight="500" fill="#CECBF6">多路视频流接入 · 整体框架（一条主线 + 两条旁路）</text>

<circle cx="52" cy="74" r="14" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="52" y="74" font-size="14" font-weight="500" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="78" y="52" width="562" height="44" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="96" y="74" font-size="14" font-weight="500" fill="#D3D1C7" dominant-baseline="central">静态结构</text>
<text x="280" y="74" font-size="12" fill="#B4B2A9" dominant-baseline="central">组件 / 驱动插件 / 档案袋 / 快递柜</text>

<circle cx="52" cy="130" r="14" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="52" y="130" font-size="14" font-weight="500" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">2</text>
<rect x="78" y="108" width="562" height="44" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="96" y="130" font-size="14" font-weight="500" fill="#D3D1C7" dominant-baseline="central">怎么被拉起</text>
<text x="280" y="130" font-size="12" fill="#B4B2A9" dominant-baseline="central">三层配置 → 工厂 new 驱动 → 起 N 个线程</text>

<circle cx="52" cy="186" r="14" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="52" y="186" font-size="14" font-weight="500" fill="#B5D4F4" text-anchor="middle" dominant-baseline="central">3</text>
<rect x="78" y="164" width="562" height="44" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="96" y="186" font-size="14" font-weight="500" fill="#B5D4F4" dominant-baseline="central">主干循环</text>
<text x="280" y="186" font-size="12" fill="#85B7EB" dominant-baseline="central">每路一线程：外层管重连，内层管读帧</text>

<circle cx="52" cy="242" r="14" fill="#26215C" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="52" y="242" font-size="14" font-weight="500" fill="#CECBF6" text-anchor="middle" dominant-baseline="central">4</text>
<rect x="78" y="220" width="562" height="44" rx="8" fill="#26215C" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="96" y="242" font-size="14" font-weight="500" fill="#CECBF6" dominant-baseline="central">内层一圈 ★</text>
<text x="280" y="242" font-size="12" fill="#AFA9EC" dominant-baseline="central">读包 → 滤流 → 封装 → 统计 → 发送 → 释放</text>

<circle cx="52" cy="298" r="14" fill="#173404" stroke="#97C459" stroke-width="0.5"/>
<text x="52" y="298" font-size="14" font-weight="500" fill="#C0DD97" text-anchor="middle" dominant-baseline="central">5</text>
<rect x="78" y="276" width="562" height="44" rx="8" fill="#173404" stroke="#97C459" stroke-width="0.5"/>
<text x="96" y="298" font-size="14" font-weight="500" fill="#C0DD97" dominant-baseline="central">东西怎么出去</text>
<text x="280" y="298" font-size="12" fill="#97C459" dominant-baseline="central">四跳 → CyberRT channel（发布订阅解耦）</text>

<circle cx="52" cy="354" r="14" fill="#412402" stroke="#EF9F27" stroke-width="0.5"/>
<text x="52" y="354" font-size="14" font-weight="500" fill="#FAC775" text-anchor="middle" dominant-baseline="central">6</text>
<rect x="78" y="332" width="562" height="44" rx="8" fill="#412402" stroke="#EF9F27" stroke-width="0.5"/>
<text x="96" y="354" font-size="14" font-weight="500" fill="#FAC775" dominant-baseline="central">怎么退</text>
<text x="280" y="354" font-size="12" fill="#EF9F27" dominant-baseline="central">断线重连 / 优雅退出</text>
</svg>
