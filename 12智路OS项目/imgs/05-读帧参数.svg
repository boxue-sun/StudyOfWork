<svg xmlns="http://www.w3.org/2000/svg" width="680" height="264" viewBox="0 0 680 264" role="img">
<title>av_read_frame 的两个参数与返回值分别是什么</title>
<desc>format_ctx 是输入参数表示从哪读，pkt 是输出参数表示读到哪，ret 是返回值只表示成功失败，数据在 pkt 里不在 ret 里。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g font-family="system-ui, -apple-system, sans-serif">
<rect x="60" y="70" width="560" height="44" rx="8" fill="#26215C" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="92" font-size="14" font-weight="500" fill="#CECBF6" text-anchor="middle" dominant-baseline="central">int ret = av_read_frame(format_ctx, &amp;pkt)</text>

<rect x="60" y="134" width="180" height="110" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="150" y="154" font-size="13" font-weight="500" fill="#B5D4F4" text-anchor="middle" dominant-baseline="central">format_ctx　输入</text>
<text x="150" y="176" font-size="12" fill="#85B7EB" text-anchor="middle" dominant-baseline="central">「从哪读」</text>
<text x="150" y="198" font-size="12" fill="#85B7EB" text-anchor="middle" dominant-baseline="central">连接句柄</text>
<text x="150" y="220" font-size="12" fill="#85B7EB" text-anchor="middle" dominant-baseline="central">open_input 建的</text>

<rect x="250" y="134" width="180" height="110" rx="8" fill="#173404" stroke="#97C459" stroke-width="0.5"/>
<text x="340" y="154" font-size="13" font-weight="500" fill="#C0DD97" text-anchor="middle" dominant-baseline="central">&amp;pkt　输出</text>
<text x="340" y="176" font-size="12" fill="#97C459" text-anchor="middle" dominant-baseline="central">「读到哪」：data / size</text>
<text x="340" y="198" font-size="12" fill="#97C459" text-anchor="middle" dominant-baseline="central">stream_index / pts</text>
<text x="340" y="220" font-size="12" fill="#97C459" text-anchor="middle" dominant-baseline="central">数据在堆上，壳在栈</text>

<rect x="440" y="134" width="180" height="110" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="530" y="154" font-size="13" font-weight="500" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">ret　返回值</text>
<text x="530" y="176" font-size="12" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">「成没成」</text>
<text x="530" y="198" font-size="12" fill="#5DCAA5" text-anchor="middle" dominant-baseline="central">≥0 成功 → 用 pkt</text>
<text x="530" y="220" font-size="12" fill="#F09595" text-anchor="middle" dominant-baseline="central">&lt;0 失败 → break 重连</text>

<path d="M150 114 L150 130" fill="none" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 114 L340 130" fill="none" stroke="#97C459" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M530 114 L530 130" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="48" font-size="14" font-weight="500" fill="#CECBF6" text-anchor="middle" dominant-baseline="central">取件类比：给「取件地点」+「空箱子」，回你一句话「成没成」</text>
</g>
</svg>
