<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img">
<title>生产者-消费者数据管道</title>
<desc>上游融合感知经 Fast-DDS 订阅推送结构化目标流 JSON，update_new_frame 解析后 put 进阻塞队列（容量60，满丢最旧）；一个工作线程 detect 不停 take 取帧，广播给 6 类检测器 update 累加；到周期边界 OutputChannel 触发各检测器 calculate_once 出数，组装成 RSM 报文经 Fast-DDS 上报。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g font-family="system-ui, -apple-system, sans-serif">
<g>
<rect x="240" y="24" width="200" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="340" y="46" text-anchor="middle" dominant-baseline="central" fill="#B5D4F4" font-size="14" font-weight="500">上游 DDS 订阅</text>
<text x="340" y="66" text-anchor="middle" dominant-baseline="central" fill="#85B7EB" font-size="12">RSMJsonTopic:9 · 生产者</text>
</g>
<g>
<rect x="240" y="104" width="200" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="340" y="126" text-anchor="middle" dominant-baseline="central" fill="#B5D4F4" font-size="14" font-weight="500">BlockingQueue 阻塞队列</text>
<text x="340" y="146" text-anchor="middle" dominant-baseline="central" fill="#85B7EB" font-size="12">容量 60 · 满丢最旧</text>
</g>
<g>
<rect x="240" y="184" width="200" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="340" y="206" text-anchor="middle" dominant-baseline="central" fill="#B5D4F4" font-size="14" font-weight="500">工作线程 detect()</text>
<text x="340" y="226" text-anchor="middle" dominant-baseline="central" fill="#85B7EB" font-size="12">单消费者 · take()</text>
</g>
<g>
<rect x="240" y="264" width="200" height="56" rx="8" fill="#173404" stroke="#97C459" stroke-width="0.5"/>
<text x="340" y="286" text-anchor="middle" dominant-baseline="central" fill="#C0DD97" font-size="14" font-weight="500">6 类检测器 update()</text>
<text x="340" y="306" text-anchor="middle" dominant-baseline="central" fill="#97C459" font-size="12">volume/queue/speed/headway/...</text>
</g>
<g>
<rect x="240" y="344" width="200" height="56" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="366" text-anchor="middle" dominant-baseline="central" fill="#D3D1C7" font-size="14" font-weight="500">OutputChannel 触发 + 上报</text>
<text x="340" y="386" text-anchor="middle" dominant-baseline="central" fill="#B4B2A9" font-size="12">周期边界 → RSM (Fast-DDS)</text>
</g>
<path d="M340 80 L340 104" fill="none" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 160 L340 184" fill="none" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 240 L340 264" fill="none" stroke="#97C459" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 320 L340 344" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>
</g>
</svg>
