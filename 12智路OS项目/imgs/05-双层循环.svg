<svg xmlns="http://www.w3.org/2000/svg" width="680" height="346" viewBox="0 0 680 346" role="img">
<title>RTSP 拉流双层循环：外层管重连，内层管读帧</title>
<desc>左侧外层循环负责判断是否继续并重连，连不上就睡五秒重试；连上后进入右侧内层循环读帧、封装 protobuf、发送并释放包；内层读失败退出后关连接、睡五秒，回到外层重连。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g font-family="system-ui, -apple-system, sans-serif">
<rect x="60" y="56" width="270" height="244" rx="16" fill="#26215C" stroke="#534AB7" stroke-width="0.5"/>
<text x="76" y="80" font-size="13" font-weight="500" fill="#CECBF6" dominant-baseline="central">外层循环　管重连</text>

<rect x="76" y="96" width="238" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="195" y="116" font-size="14" font-weight="500" fill="#B5D4F4" text-anchor="middle" dominant-baseline="central">ConnectRtspStream()</text>
<text x="195" y="134" font-size="12" fill="#85B7EB" text-anchor="middle" dominant-baseline="central">打开 RTSP + 找视频流索引</text>

<text x="76" y="174" font-size="12" fill="#EF9F27" dominant-baseline="central">失败 → sleep(5s)</text>
<text x="76" y="196" font-size="12" fill="#EF9F27" dominant-baseline="central">→ continue 回外层顶部</text>

<rect x="76" y="210" width="238" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="195" y="230" font-size="14" font-weight="500" fill="#9FE1CB" text-anchor="middle" dominant-baseline="central">连上 → connected = true</text>
<text x="195" y="248" font-size="12" fill="#5DCAA5" text-anchor="middle" dominant-baseline="central">顺序往下，进入内层</text>

<rect x="370" y="56" width="270" height="244" rx="16" fill="#04342C" stroke="#0F6E56" stroke-width="0.5"/>
<text x="386" y="80" font-size="13" font-weight="500" fill="#9FE1CB" dominant-baseline="central">内层循环　管读帧 + 发布</text>

<rect x="386" y="96" width="238" height="56" rx="8" fill="#173404" stroke="#97C459" stroke-width="0.5"/>
<text x="505" y="116" font-size="14" font-weight="500" fill="#C0DD97" text-anchor="middle" dominant-baseline="central">av_read_frame 读一个包</text>
<text x="505" y="134" font-size="12" fill="#97C459" text-anchor="middle" dominant-baseline="central">ret 只是返回值，数据在 pkt 里</text>

<text x="386" y="174" font-size="12" fill="#F09595" dominant-baseline="central">ret &lt; 0 → 断线 → break</text>

<rect x="386" y="188" width="238" height="52" rx="8" fill="#173404" stroke="#97C459" stroke-width="0.5"/>
<text x="505" y="206" font-size="14" font-weight="500" fill="#C0DD97" text-anchor="middle" dominant-baseline="central">封装 + 统计 + 发送</text>
<text x="505" y="224" font-size="12" fill="#97C459" text-anchor="middle" dominant-baseline="central">set_xxx / 帧间隔 / sender_()</text>

<rect x="386" y="252" width="238" height="32" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="505" y="268" font-size="13" font-weight="500" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">av_packet_unref 释放包</text>

<path d="M332 238 L364 238" fill="none" stroke="#5DCAA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<path d="M505 300 V326 H48 V44 H195 V50" fill="none" stroke="#EF9F27" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="276" y="314" font-size="12" fill="#EF9F27" text-anchor="middle" dominant-baseline="central">退出内层 → 关连接 → sleep 5s → 回外层重连</text>
</g>
</svg>
