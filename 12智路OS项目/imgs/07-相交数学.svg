<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img">
<title>过线判定的相交数学：叉积 + 参数方程</title>
<desc>Segment2D::has_intersect 用二维叉积算分母 d，再解出交点在两条线段上的参数 r、s，都在 [0,1] 内才判为真相交。分子分母本质都是叉积（有向面积）。</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g font-family="system-ui, -apple-system, sans-serif">
<text x="340" y="26" text-anchor="middle" dominant-baseline="central" fill="#CECBF6" font-size="14" font-weight="500">线段相交 = 叉积算分母 d + 解参数 r、s ∈ [0,1]</text>

<!-- 图示区 -->
<rect x="50" y="44" width="580" height="186" rx="10" fill="#1E1B3A" stroke="#3A3470" stroke-width="0.8"/>
<line x1="130" y1="150" x2="550" y2="150" stroke="#97C459" stroke-width="3" marker-end="url(#arrow2)"/>
<text x="558" y="146" text-anchor="end" dominant-baseline="central" fill="#9FE1CB" font-size="12">停止线 P3→P4（d2）</text>
<line x1="230" y1="210" x2="450" y2="70" stroke="#85B7EB" stroke-width="2.5" marker-end="url(#arrow2)"/>
<text x="218" y="226" text-anchor="middle" dominant-baseline="central" fill="#85B7EB" font-size="12">上一帧 P1</text>
<text x="458" y="64" text-anchor="middle" dominant-baseline="central" fill="#85B7EB" font-size="12">当前帧 P2（d1）</text>
<circle cx="340" cy="150" r="7" fill="#EF9F27"/>
<text x="352" y="172" text-anchor="start" dominant-baseline="central" fill="#EF9F27" font-size="12">交点 X</text>
<text x="130" y="138" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB" font-size="11">P3</text>
<text x="550" y="138" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB" font-size="11">P4</text>
<text x="300" y="120" text-anchor="middle" dominant-baseline="central" fill="#6E6A8F" font-size="11">d1 = P2−P1，d2 = P4−P3</text>

<!-- 公式卡 -->
<rect x="50" y="244" width="580" height="180" rx="10" fill="#26215C" stroke="#4A4390" stroke-width="0.8"/>
<text x="70" y="270" fill="#CECBF6" font-size="13" font-weight="600">① 分母 d（二维叉积，= cross(d1, d2)）</text>
<text x="70" y="292" fill="#D3D1C7" font-size="12">d = d1.x·d2.y − d1.y·d2.x　　若 d == 0 → 两线平行，直接 return false（无交点）</text>

<text x="70" y="322" fill="#CECBF6" font-size="13" font-weight="600">② 参数 r、s（分子也是叉积 = 有向面积×2）</text>
<text x="70" y="344" fill="#D3D1C7" font-size="12">r = [ (P1.y−P3.y)·d2.x − (P1.x−P3.x)·d2.y ] / d</text>
<text x="70" y="364" fill="#D3D1C7" font-size="12">s = [ (P1.y−P3.y)·d1.x − (P1.x−P3.x)·d1.y ] / d</text>

<text x="70" y="394" fill="#CECBF6" font-size="13" font-weight="600">③ 判定</text>
<text x="70" y="414" fill="#9FE1CB" font-size="12">0 ≤ r ≤ 1 且 0 ≤ s ≤ 1 ⇒ 交点同时落在两条线段上 ⇒ 真相交（不是无限直线交叉）</text>
</g>
</svg>
