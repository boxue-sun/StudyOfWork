<svg xmlns="http://www.w3.org/2000/svg" width="680" height="206" viewBox="0 0 680 206" role="img">
<title>相机驱动在系统中的位置：搬运、打包、投递</title>
<desc>四路相机推 RTSP 流，StandardIpCamera 驱动负责拉流拆包并封装成 protobuf 消息，发到 CyberRT 总线对应 topic，下游的感知、录制和 Python 工具按需订阅。驱动不解码，也不关心谁消费。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g font-family="system-ui, -apple-system, sans-serif">
<text x="50" y="48" font-size="14" font-weight="500" fill="#CECBF6" dominant-baseline="central">整体数据流：这个模块在系统里站在哪儿</text>

<rect x="50" y="70" width="130" height="64" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="115" y="92" font-size="13" font-weight="500" fill="#B5D4F4" text-anchor="middle" dominant-baseline="central">相机（RTSP）</text>
<text x="115" y="112" font-size="12" fill="#85B7EB" text-anchor="middle" dominant-baseline="central">4 路 IPC 持续推流</text>

<rect x="200" y="70" width="130" height="64" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="265" y="92" font-size="13" font-weight="500" fill="#B5D4F4" text-anchor="middle" dominant-baseline="central">拉流驱动</text>
<text x="265" y="112" font-size="12" fill="#85B7EB" text-anchor="middle" dominant-baseline="central">拉流 + 拆包 + 封装</text>

<rect x="350" y="70" width="130" height="64" rx="8" fill="#173404" stroke="#97C459" stroke-width="0.5"/>
<text x="415" y="92" font-size="13" font-weight="500" fill="#C0DD97" text-anchor="middle" dominant-baseline="central">消息总线 topic</text>
<text x="415" y="112" font-size="12" fill="#97C459" text-anchor="middle" dominant-baseline="central">每路一个频道</text>

<rect x="500" y="70" width="130" height="64" rx="8" fill="#173404" stroke="#97C459" stroke-width="0.5"/>
<text x="565" y="92" font-size="13" font-weight="500" fill="#C0DD97" text-anchor="middle" dominant-baseline="central">下游模块</text>
<text x="565" y="112" font-size="12" fill="#97C459" text-anchor="middle" dominant-baseline="central">感知 / 录制 / 工具</text>

<path d="M182 102 L196 102" fill="none" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M332 102 L346 102" fill="none" stroke="#5DCAA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M482 102 L496 102" fill="none" stroke="#5DCAA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="50" y="152" width="580" height="34" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="169" font-size="12" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">驱动不解码、也不管谁来取：只做「搬运 + 打包（贴标签）+ 投递到频道」</text>
</g>
</svg>
