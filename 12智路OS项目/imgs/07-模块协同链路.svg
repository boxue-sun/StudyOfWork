<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img">
<title>AirOS 与 traffic_flow 协同链路（两套中间件不直连）</title>
<desc>相机 → AirOS(CyberRT 拉流/解码/融合) → FusionService(宿主框架 DDS 桥，发布 RSMJsonTopic:9) → traffic_flow 插件(DDS 订阅，算参数，发布 TrafficFlowJson 上报)。AirOS 的 CyberRT 与 traffic_flow 的 Fast-DDS 不直接通信，中间隔着 FusionService 插件桥；traffic_flow 作为 .so 只认 C 接口 + FusionMsg。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g font-family="system-ui, -apple-system, sans-serif">
<g>
<rect x="20" y="150" width="80" height="60" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="60" y="172" text-anchor="middle" dominant-baseline="central" fill="#D3D1C7" font-size="14" font-weight="500">相机</text>
<text x="60" y="192" text-anchor="middle" dominant-baseline="central" fill="#B4B2A9" font-size="12">感知源</text>
</g>
<rect x="130" y="120" width="120" height="120" rx="12" fill="#26215C" stroke="#534AB7" stroke-width="0.5"/>
<text x="190" y="150" text-anchor="middle" dominant-baseline="central" fill="#CECBF6" font-size="14" font-weight="500">AirOS</text>
<text x="190" y="172" text-anchor="middle" dominant-baseline="central" fill="#CECBF6" font-size="12">CyberRT</text>
<text x="190" y="194" text-anchor="middle" dominant-baseline="central" fill="#CECBF6" font-size="12">拉流·解码·融合</text>
<rect x="290" y="120" width="150" height="120" rx="12" fill="#04342C" stroke="#0F6E56" stroke-width="0.5"/>
<text x="365" y="150" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB" font-size="14" font-weight="500">FusionService</text>
<text x="365" y="172" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB" font-size="12">宿主框架 · DDS 桥</text>
<text x="365" y="194" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB" font-size="12">发布 RSMJson:9</text>
<rect x="470" y="120" width="150" height="120" rx="12" fill="#04342C" stroke="#0F6E56" stroke-width="0.5"/>
<text x="545" y="150" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB" font-size="14" font-weight="500">traffic_flow 插件</text>
<text x="545" y="172" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB" font-size="12">DDS 订阅</text>
<text x="545" y="194" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB" font-size="12">算交通参数</text">
<path d="M100 180 L130 180" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M250 180 L290 180" fill="none" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M440 180 L470 180" fill="none" stroke="#97C459" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M545 240 L545 300" fill="none" stroke="#97C459" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270" y="168" text-anchor="middle" fill="#CECBF6" font-size="11">目标流</text>
<text x="455" y="168" text-anchor="middle" fill="#9FE1CB" font-size="11">DDS domain 11</text>
<text x="545" y="320" text-anchor="middle" fill="#9FE1CB" font-size="12">发布 TrafficFlowJson → 上报 RSM</text>
<text x="340" y="345" text-anchor="middle" fill="#B4B2A9" font-size="11">traffic_flow 编译成 .so 挂到 FusionService，只实现 C 函数指针接口（Init / OnDataAvailable / Publish），</text>
<text x="340" y="363" text-anchor="middle" fill="#B4B2A9" font-size="11">经 FusionMsg 收/发字节——代码零 CyberRT / Fast-DDS 头文件依赖，中间件由宿主框架负责。</text>
</g>
</svg>
